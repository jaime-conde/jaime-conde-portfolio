name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Prepare browser-safe tracking demos
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          for input in \
            public/images/Missile_vid_output.mp4 \
            public/images/Missile_vid2_output.mp4 \
            public/images/Missile_vid4_output.mp4
          do
            output="${input%.mp4}_web.mp4"
            ffmpeg -y -i "$input" -an -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -movflags +faststart "$output"
          done

      - name: Build static site
        run: npx next build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Manual retry requested after enabling GitHub Pages.
